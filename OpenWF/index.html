<!DOCTYPE html>
<style>
	body{font-family:sans-serif;background:#000;filter:invert(1)}
	ul{margin-top:0.5rem;padding-inline-start:30px}
</style>
<body>
	<p style="margin-block-start:0"><label for="server_host"></label> <input id="server_host" type="text" /> <button id="server_host_submit"></button> <button id="logout"></button></p>
	<p><label for="high_damage_numbers_patch"></label> <input id="high_damage_numbers_patch" type="checkbox" /></p>
	<p><label for="skip_mission_start_timer"></label> <input id="skip_mission_start_timer" type="checkbox" /></p>
	<p><label for="simulacrum_blacklisted"></label> <input id="simulacrum_blacklisted" type="checkbox" /></p>
	<p><label for="simulacrum_whitelisted"></label> <input id="simulacrum_whitelisted" type="checkbox" /></p>
	<p><label for="pause_always_stops_time"></label> <input id="pause_always_stops_time" type="checkbox" /></p>
	<p><label for="ee_log_in_console"></label> <input id="ee_log_in_console" type="checkbox" /></p>
	<p><label for="fov_override"></label> <input id="fov_override" type="range" min="0" value="0" max="2260000" step="10000"></p>
	<button id="save_config"></button>
	<hr>
	<p><label for="camtype"></label> <select id="camtype"><option value="gamecam"></option><option value="freecam"></option><option value="lockcam"></option></select></p>
	<p><label for="pos"></label> <input id="pos" type="text" style="width:230px" onclick="this.select()" readonly /></p>
	<p><button id="tp_submit"></button> <select id="tp-target"><option value="custom"></option></select> <input id="tp-pos" type="text" style="width:230px" onclick="this.select()" /></p>
	<hr>
	<div id="scripts-container"></div>
	<textarea id="script_log" style="width:100%;height:150px" readonly></textarea>
	<p><button id="clear_script_log" onclick="clearScriptLog()"></button></p>
	<p><label for="console"></label> <input id="console" type="checkbox" /></p>
	<script src="/dict.js"></script>
	<script>
		document.querySelectorAll("label[for]").forEach(elm => {
			elm.textContent = dict[elm.getAttribute("for")] + ": ";
		});
		document.querySelectorAll("button[id]").forEach(elm => {
			elm.textContent = dict[elm.id];
		});
		document.querySelectorAll("option[value]").forEach(elm => {
			elm.textContent = dict[elm.value];
		});

		fetch("/server_host").then(res => res.text()).then(res => {
			document.getElementById("server_host").value = res;
		});
		document.getElementById("server_host_submit").onclick = function() {
			fetch("/server_host?" + document.getElementById("server_host").value);
		};
		document.getElementById("logout").onclick = function() {
			fetch("/logout");
		};

		fetch("/high_damage_numbers_patch").then(res => res.text()).then(res => {
			document.getElementById("high_damage_numbers_patch").checked = (res == "1");
		});
		document.getElementById("high_damage_numbers_patch").onchange = function() {
			fetch("/high_damage_numbers_patch?" + this.checked);
		};

		fetch("/skip_mission_start_timer").then(res => res.text()).then(res => {
			document.getElementById("skip_mission_start_timer").checked = (res == "1");
		});
		document.getElementById("skip_mission_start_timer").onchange = function() {
			fetch("/skip_mission_start_timer?" + this.checked);
		};

		fetch("/simulacrum_blacklisted").then(res => res.text()).then(res => {
			document.getElementById("simulacrum_blacklisted").checked = (res == "1");
		});
		document.getElementById("simulacrum_blacklisted").onchange = function() {
			fetch("/simulacrum_blacklisted?" + this.checked);
		};

		fetch("/simulacrum_whitelisted").then(res => res.text()).then(res => {
			document.getElementById("simulacrum_whitelisted").checked = (res == "1");
		});
		document.getElementById("simulacrum_whitelisted").onchange = function() {
			fetch("/simulacrum_whitelisted?" + this.checked);
		};

		fetch("/ee_log_in_console").then(res => res.text()).then(res => {
			document.getElementById("ee_log_in_console").checked = (res == "1");
		});
		document.getElementById("ee_log_in_console").onchange = function() {
			fetch("/ee_log_in_console?" + this.checked);
		};

		fetch("/pause_always_stops_time").then(res => res.text()).then(res => {
			document.getElementById("pause_always_stops_time").checked = (res == "1");
		});
		document.getElementById("pause_always_stops_time").onchange = function() {
			if (this.checked) {
				fetch("/start_script_inline?" + encodeURIComponent(`set_pause_always_stops_time(true)`));
			}
			else {
				fetch("/start_script_inline?" + encodeURIComponent(`gGameRules:RequestUnpause() set_pause_always_stops_time(false)`));
			}
		};

		fetch("/fov_override").then(res => res.text()).then(res => {
			document.getElementById("fov_override").value = parseFloat(res) * 10000;
		});
		document.getElementById("fov_override").oninput = function() {
			fetch("/fov_override?" + this.value);
		};

		document.getElementById("save_config").onclick = function() {
			fetch("/save_config");
		};

		document.getElementById("camtype").onchange = function() {
			fetch("/" + this.value);
		};

		const marker_types = {
			"3": dict.marker_obj,
			"9": dict.marker_target,
			"12": dict.marker_surcap,
			"29": dict.marker_target,
			"31": dict.marker_surpup,
			"40": dict.marker_a,
			"41": dict.marker_b,
			"42": dict.marker_c,
			"49": dict.marker_wp,
			"65": dict.marker_focus,
			"75": dict.marker_extract,
		};

		function onMarkersChange() {
			document.getElementById("tp-pos").style.display = document.getElementById("tp-target").value == "custom" ? "" : "none";
		}

		let ws = new WebSocket(location.href);
		let status_request_suffix = "?0";
		const script_broadcast_requested = {};
		function pollStatus() {
			ws.send("/status" + status_request_suffix);
		}
		ws.onopen = function() {
			pollStatus();
		};
		ws.onmessage = function(e) {
			const obj = JSON.parse(e.data);

			if ("console" in obj) {
				document.getElementById("console").checked = obj.console;
			}

			if ("camtype" in obj) {
				if (obj.camtype) {
					document.getElementById("camtype").value = obj.camtype;
				}
			}

			if ("pos" in obj) {
				document.getElementById("pos").value = obj.pos ?? "";
			}

			if ("bgscript_status_string" in obj) {
				const bgscript_status = obj.bgscript_status_string ? JSON.parse(obj.bgscript_status_string) : {};
				bgscript_status.markers ??= [];
				const marker_set = {};
				for (const marker of bgscript_status.markers) {
					if (marker.type != 14) {
						const name = dict.marker.split("|TYPE|").join(marker.type in marker_types ? marker_types[marker.type] : dict.marker_unk).split("|DIST|").join(marker.dist);
						const pos = marker.x + "," + marker.y + "," + marker.z;
						const slug = marker.type == 49 ? "wp" : pos;
						marker_set[slug] = true;
						let option = document.querySelector("#tp-target [data-slug='"+slug+"']");
						if (!option) {
							option = document.getElementById("tp-target").appendChild(document.createElement("option"));
							option.setAttribute("data-slug", slug);
						}
						if (option.value != pos) {
							option.value = pos;
						}
						if (option.textContent != name) {
							option.textContent = name;
						}
					}
				}
				for (const child of document.getElementById("tp-target").children) {
					if (child.value != "custom" && !(child.getAttribute("data-slug") in marker_set)) {
						document.getElementById("tp-target").removeChild(child);
						onMarkersChange();
					}
				}
			}

			if ("running_scripts" in obj) {
				for (const script of document.getElementById("scripts-container").children) {
					const path = script.children[1].getAttribute("data-path");
					const running = obj.running_scripts.find(x => x == path);
					script.children[1].checked = running;
					if (running) {
						if (!script_broadcast_requested[path]) {
							script_broadcast_requested[path] = true;
							fetch(path.substr(6) + "/request_broadcast");
						}
					}
					else {
						if (script_broadcast_requested[path]) {
							script.querySelector("ul").textContent = "";
							delete script_broadcast_requested[path];
						}
					}
				}
			}

			if ("script_log_sub" in obj) {
				if (obj.script_log_sub) {
					const log = document.getElementById("script_log");
					log.textContent += obj.script_log_sub;
					log.scrollTop = log.scrollHeight;
					status_request_suffix = "?" + obj.script_log_len;
				}
			}

			if ("script_broadcast" in obj) {
				const p = [...document.getElementById("scripts-container").children].find(x => x.children[1].getAttribute("data-path") == obj.from);
				let ul = p.querySelector("ul");
				if (!ul) {
					ul = p.appendChild(document.createElement("ul"));
				}
				ul.innerHTML = "";
				obj.script_broadcast.toggles.forEach(toggle => {
					const li = document.createElement("li");
					{
						const label = document.createElement("label");
						label.setAttribute("for", obj.from + toggle.name);
						label.textContent = toggle.name + ": ";
						li.appendChild(label);
					}
					{
						const input = document.createElement("input");
						input.id = obj.from + toggle.name;
						input.type = "checkbox";
						input.onchange = function() {
							fetch(obj.from.substr(6) + "/set_toggle?" + (this.checked ? "1" : "0") + encodeURIComponent(toggle.name));
						};
						li.appendChild(input);
					}
					ul.appendChild(li);
				});
			}

			if ("full" in obj) {
				setTimeout(pollStatus, 20);
			}
		};
		ws.onerror = function(e) {
			console.error(e);
			document.body.innerHTML = `<p style="margin-block-start:0">` + dict.err + ` <a href="/">` + dict.err_retry + `</a></p>`;
		};

		function clearScriptLog() {
			status_request_suffix = "";
			fetch("/clear_script_log").then(() => {
				status_request_suffix = "?0";
				document.getElementById("script_log").innerHTML = "";
			});
		}

		document.getElementById("tp-target").onchange = onMarkersChange;

		document.getElementById("tp_submit").onclick = function() {
			let pos = document.getElementById("tp-target").value;
			if (pos == "custom") {
				pos = document.getElementById("tp-pos").value
			}
			fetch("/teleport?" + pos);
		};

		document.getElementById("console").onchange = function() {
			fetch("/toggle_console");
		};

		fetch("/scripts").then(res => res.json()).then(res => {
			res.forEach(script => {
				const p = document.createElement("p");
				const label = document.createElement("label");
				label.setAttribute("for", script);
				label.textContent = script + ": ";
				p.appendChild(label);
				const input = document.createElement("input");
				input.id = script;
				input.type = "checkbox";
				input.setAttribute("data-path", "OpenWF/scripts/" + script);
				input.onchange = function() {
					fetch((this.checked ? "/start_script?" : "/stop_script?") + this.getAttribute("data-path"));
				};
				p.appendChild(input);
				const button = document.createElement("button");
				button.style.marginLeft = "10px";
				button.textContent = dict.enable_auto_start;
				button.onclick = function() {
					const on = (this.textContent != dict.enable_auto_start);
					fetch((on ? "/remove_autostart_script?" : "/add_autostart_script?") + script);
					this.textContent = (on ? dict.enable_auto_start : dict.disable_auto_start);
				};
				p.appendChild(button);
				document.getElementById("scripts-container").appendChild(p);
			});
			fetch("/autostart_scripts").then(res => res.json()).then(res => {
				res.forEach(script => {
					document.querySelector("input[id='" + script + "']").parentNode.querySelector("button").textContent = dict.disable_auto_start;
				});
			});
		});
	</script>
</body>
